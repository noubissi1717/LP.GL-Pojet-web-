<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Connexion</title>
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    font-family: "Poppins", sans-serif;
  }

  .container{
    width:820px;
    height:500px;
    display:flex;
    border-radius:20px;
    overflow:hidden;              /* nécessaire pour arrondir les coins externes */
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
  }

  
  .right{
    flex:1;
    background:#ccf1b7;   
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;

    
  }

  /* =========== partie droite =========== */
  .left{
    flex:1;
    /* on laisse transparent pour que la forme (pseudo-élément) soit visible */
    background: #ccf1b7;
    position:relative;            /* indispensable pour l'absolu du ::before */
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#fff;
  }

  /* pseudo-élément qui dessine la grande courbe violette */
  .left::before{
    content: "";
    position: absolute;
    top: 0;
    left: -10px;                 /* ajuste la largeur de débordement */
    width: 100%;                  /* large pour créer la demi-lune */
    height: 100%;
    background:#58a154;       /* couleur violette */
    /* arrondir fortement le côté gauche pour faire la "lune" */
    border-top-right-radius: 60% 100%;
    border-bottom-right-radius: 60% 100%;
    z-index: 0;                   /* NOTE: zéro, visible derrière le contenu direct */
  }

  /* S'assurer que tout le contenu à l'intérieur de .right est au-dessus */
  .left > * {
    position: relative;
    z-index: 1;
  }

  /* ---------- styles restants (formulaire / boutons) ---------- */
  h2{ 
    font-size:28px; 
    text-align:center; 
    margin:0 0 20px 0; 
    }
  form{ 
    display:flex; 
    flex-direction:column; 
    gap:14px; 
  }
  input{ 
    padding:10px; 
    border:1px solid #333; 
    border-radius:6px; 
    font-size:14px; 
}
  .forgot{ 
    color:red; 
    text-decoration:none; 
    font-size:14px; 
}
  .signin-btn{
    background:#fff; 
    border:2px solid #000;
    padding:10px; 
    border-radius:8px; 
    cursor:pointer;
    font-weight:600;
  }
  .signin-btn:hover{ 
    background-color: #dee0de;
}
  .signup-btn:hover{ 
    background-color: #dee0de;
}
  .social-icons{ 
    display:flex; 
    gap:10px; 
    justify-content:center;
     margin-top:18px; 
    }
  .social-icons img{ 
    width:36px; 
    height:36px; 
    border-radius:6px; 
    padding:6px; 
    background:#fff; 
    border:1px solid #ccc; 
}
  .left h1{ 
    font-size:30px; 
    margin:0 0 8px 0; 
}
  .left p{ 
    margin:0 0 18px 0; 
    opacity:0.95;
 }
  .signup-btn{ 
    background:#ccf1b7; 
    border:2px solid #000; 
    padding:10px 20px; 
    border-radius:8px; 
    cursor:pointer; 
    width: 200px; }

  /* responsiveness basique */
  @media (max-width:820px){
    .container{ 
        width:92%; 
        height:auto; 
        flex-direction:column; 
    }
    .left::before{ 
        left:-50%; 
        width:200%; 
    } /* adapte la courbe quand empilé */
  }
</style>
</head>
<body>

  <div class="container">
        <!-- partie gauche -->
        <div class="left">
            <h1>! Hello, Welcome !</h1>
            <p>You have already account?</p>
            <button class="signup-btn">SIGN IN</button>
        </div>

        <!-- partie droite -->
        <div class="right">
            <h2>SIGN UP</h2>
            <form>
                <input type="text" placeholder="user name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirmed" required>
                
                <button class="signin-btn" type="submit">Sign Up</button>
                <div class="social-icons">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="G">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg" alt="F">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="I">
                </div>
            </form>
        </div>
  </div>

</body>
</html>
